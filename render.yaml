services:
  - type: web
    name: universal-video-transcriber-cloud
    runtime: docker
    plan: free
    branch: cloud-free-deploy
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ready
    autoDeployTrigger: off
    envVars:
      - key: TRANSCRIPTION_PROVIDER
        value: cloudflare
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: MAX_VIDEO_DURATION_SECONDS
        value: "0"
      - key: CLOUD_CHUNK_SECONDS
        value: "900"
      - key: CLOUD_CHUNK_OVERLAP_SECONDS
        value: "3"
      - key: CLOUDFLARE_REQUEST_TIMEOUT_SECONDS
        value: "600"
      - key: CLOUDFLARE_INTER_CHUNK_DELAY_SECONDS
        value: "0.2"
      - key: MAX_CONCURRENT_JOBS
        value: "1"
      - key: RESULT_RETENTION_DAYS
        value: "10"
      - key: CLEANUP_INTERVAL_HOURS
        value: "24"
      - key: TRANSCRIPTION_CACHE_ENABLED
        value: "true"
      - key: APP_ENV
        value: production
